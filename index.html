<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Profil — Print Legacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#C9A84C;--gold2:#E8C97A;--gold-bg:rgba(201,168,76,0.1);--gold-15:rgba(201,168,76,0.15);--gold-20:rgba(201,168,76,0.2);--gold-25:rgba(201,168,76,0.25);--gold-40:rgba(201,168,76,0.4);--gold-45:rgba(201,168,76,0.45);--ink:#0D0D0D;--ink2:#2A1E0E;--white:#FFFFFF;--cream:#F5F0E8;--cream2:#EDE5D5;--muted:#8A8070;--border:rgba(0,0,0,0.07)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#EDEAE3;font-family:"DM Sans",sans-serif}
body{display:flex;justify-content:center;padding-bottom:90px}
.card{width:100%;max-width:420px;background:var(--white);min-height:100vh;position:relative}
.hero{position:relative;width:100%;height:420px;overflow:hidden;background:#1A1510;flex-shrink:0}
.hero-img{width:100%;height:100%;object-fit:cover;display:block}
.hero-placeholder{width:100%;height:100%;background:linear-gradient(160deg,var(--ink),var(--ink2));display:flex;align-items:center;justify-content:center}
.hero-initials-big{font-family:"Playfair Display",serif;font-size:6rem;font-weight:700;color:var(--gold-20)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0.05) 25%,rgba(0,0,0,0.6) 65%,rgba(0,0,0,0.88) 100%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 1.4rem 1.7rem}
.hero-badge{display:inline-flex;align-items:center;border:1px solid var(--gold-45);border-radius:100px;padding:.28rem .9rem;font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:.85rem}
.hero-name{font-family:"Playfair Display",serif;font-size:2rem;font-weight:700;color:var(--white);line-height:1.15;margin-bottom:.15rem}
.hero-role{font-size:.82rem;color:rgba(255,255,255,.55);font-weight:400}
.hero-role em{color:var(--gold);font-style:normal;font-weight:600}
.company-card-wrap{margin:1rem 1.2rem}
.company-card{background:var(--cream);border-radius:14px;padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--cream2);transition:border-color .15s}
.company-card[onclick]:hover{border-color:var(--gold-40)}
.co-left{display:flex;align-items:center;gap:.75rem}
.co-logo{width:44px;height:44px;border-radius:10px;background:var(--white);border:1px solid var(--cream2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted)}
.co-logo img{width:30px;height:30px;object-fit:contain}
.co-logo svg{width:22px;height:22px}
.co-logo-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.co-logo-fallback svg{width:22px;height:22px}
.co-name{font-size:.9rem;font-weight:600;color:var(--ink);margin-bottom:3px}
.co-badge{display:inline-block;background:var(--gold-bg);border:1px solid var(--gold-20);border-radius:3px;padding:.15rem .55rem;font-size:.57rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.co-arr{width:26px;height:26px;border-radius:50%;background:var(--white);border:1px solid var(--cream2);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:transform .2s}
.co-arr svg{width:12px;height:12px}
.co-arr.open{transform:rotate(90deg)}
.co-details{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--white);border:1px solid var(--cream2);border-top:none;border-radius:0 0 14px 14px;margin-top:-1px}
.co-details>*{border-top:1px solid var(--cream2)}
.co-details>*:first-child{border-top:none}
.co-detail-row{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;text-decoration:none;color:var(--ink);font-size:.78rem}
.co-detail-about{padding:.8rem 1rem;font-size:.78rem;color:var(--muted);line-height:1.7}
.co-detail-ico{width:18px;height:18px;color:var(--gold);flex-shrink:0;display:flex}
.co-detail-ico svg{width:100%;height:100%}
.sec{padding:0 1.2rem 1.1rem}
.sec-header{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;padding-bottom:.65rem;border-bottom:1px solid var(--cream2)}
.sec-ico{width:32px;height:32px;border-radius:8px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold)}
.sec-ico svg{width:16px;height:16px}
.sec-lbl{font-size:.65rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.divider{display:flex;align-items:center;justify-content:center;padding:.3rem 1.2rem 1.1rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--cream2)}
.divider span{width:5px;height:5px;border-radius:50%;background:var(--gold);margin:0 .5rem}
.about-txt{font-size:.8rem;color:var(--muted);line-height:1.8}
.contact-list{display:flex;flex-direction:column;gap:.45rem}
.clink{display:flex;align-items:center;gap:.8rem;padding:.8rem .9rem;border-radius:12px;background:var(--cream);text-decoration:none;border:1px solid transparent;transition:all .18s}
.clink:hover{border-color:var(--gold);background:var(--white)}
.clink-ico{width:36px;height:36px;border-radius:9px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold)}
.clink-ico svg{width:18px;height:18px}
.clink-body{flex:1;min-width:0}
.clink-lbl{font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.clink-val{font-size:.84rem;font-weight:500;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clink-arr{font-size:.72rem;color:var(--muted);flex-shrink:0}
.soc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.soc-btn{display:flex;flex-direction:column;align-items:center;padding:.85rem .3rem .7rem;border-radius:12px;background:var(--cream);border:1px solid var(--cream2);text-decoration:none;gap:5px;transition:all .18s}
.soc-btn:hover{border-color:var(--gold);background:var(--white);transform:translateY(-2px)}
.soc-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.soc-ico svg{width:19px;height:19px}
.soc-name{font-size:.58rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-align:center}
 
/* ── CATALOGUE ── */
.cat-scroll{display:flex;gap:.85rem;overflow-x:auto;padding:.2rem .05rem .8rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-card{flex:0 0 148px;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:var(--cream);border:1px solid var(--cream2);display:flex;flex-direction:column;cursor:pointer;transition:transform .18s,border-color .18s}
.cat-card:active{transform:scale(.97)}
.cat-card:hover{transform:translateY(-3px);border-color:var(--gold-40)}
.cat-img-wrap{width:100%;height:130px;background:var(--cream2);overflow:hidden;flex-shrink:0}
.cat-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.cat-card:hover .cat-img-wrap img{transform:scale(1.05)}
.cat-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.4}
.cat-img-placeholder svg{width:34px;height:34px}
.cat-body{padding:.65rem .8rem .8rem;flex:1;display:flex;flex-direction:column;gap:.2rem}
.cat-name{font-size:.8rem;font-weight:700;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-desc{font-size:.68rem;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.cat-price{font-family:"Playfair Display",serif;font-size:.95rem;font-weight:700;color:var(--gold);margin-top:.25rem}
 
/* ── LIGHTBOX (bottom sheet) ── */
.lb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:flex-end;justify-content:center;padding:0}
.lb-ov.open{display:flex}
.lb-sheet{background:var(--white);border-radius:22px 22px 0 0;width:100%;max-width:420px;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.3);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* FIX : image complète sans recadrage */
.lb-img{width:100%;max-height:360px;object-fit:contain;display:block;background:var(--cream2)}
.lb-img-placeholder{width:100%;height:160px;background:var(--cream2);display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.45}
.lb-img-placeholder svg{width:48px;height:48px}
.lb-body{padding:1.2rem 1.3rem 2rem}
.lb-name{font-family:"Playfair Display",serif;font-size:1.2rem;font-weight:700;color:var(--ink);margin-bottom:.4rem}
.lb-desc{font-size:.82rem;color:var(--muted);line-height:1.75;margin-bottom:.8rem}
.lb-price{font-family:"Playfair Display",serif;font-size:1.4rem;font-weight:700;color:var(--gold)}
.lb-order-btn{display:block;width:100%;margin-top:1rem;padding:.85rem;border-radius:12px;background:var(--ink);color:#fff;text-align:center;font-weight:700;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;font-family:"DM Sans",sans-serif}
.lb-close{position:absolute;top:.9rem;right:1rem;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(4px)}
.lb-close svg{width:15px;height:15px}
.lb-counter{position:absolute;top:.7rem;left:.7rem;z-index:10;color:#fff;font-size:.68rem;letter-spacing:.05em;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:100px;backdrop-filter:blur(4px)}
.lb-img-stage{position:relative}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(4px);transition:background .15s;user-select:none}
.lb-nav:hover{background:rgba(0,0,0,.55)}
.lb-nav.disabled{opacity:.25;pointer-events:none}
.lb-nav-prev{left:.7rem}
.lb-nav-next{right:.7rem}
.lb-handle{width:36px;height:4px;background:var(--cream2);border-radius:2px;margin:10px auto 0;cursor:pointer}
 
.save-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--ink);padding:.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.sb-left{display:flex;align-items:center;gap:.7rem}
.sb-av{width:36px;height:36px;border-radius:50%;background:var(--gold-15);border:1px solid var(--gold-25);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--gold);overflow:hidden;flex-shrink:0}
.sb-av img{width:100%;height:100%;object-fit:cover}
.sb-txt{display:flex;flex-direction:column}
.sb-sublbl{font-size:.57rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.sb-title{font-size:.84rem;font-weight:600;color:var(--white)}
.sb-btn{width:38px;height:38px;border-radius:10px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:var(--ink);transition:all .2s;flex-shrink:0}
.sb-btn:hover{background:var(--gold2);transform:scale(1.06)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;color:var(--muted);background:var(--white)}
.spin{width:30px;height:30px;border:2.5px solid var(--cream2);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:.8rem;text-align:center;padding:2rem;background:var(--white)}
.err h2{font-family:"Playfair Display",serif;font-size:1.4rem;color:var(--ink)}
.err svg{width:100%;height:100%}
.err p{color:var(--muted);font-size:.875rem;line-height:1.7}
.err a{color:var(--gold);font-weight:600;text-decoration:none}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--white);padding:.65rem 1.4rem;border-radius:100px;font-size:.78rem;font-weight:600;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{transform:translateX(-50%) translateY(0)}
.spacer{height:1rem}

/* ═══════════ PROFIL UNIVERSITAIRE (scopé .uni — n'affecte pas les profils classiques) ═══════════ */
.uni{
  --u-primary:#1f3a8a;--u-accent:#8fb4e3;--u-surface:#fff;--u-on-primary:#fff;
  --u-tint:color-mix(in srgb,var(--u-accent) 16%,#fff);
  --u-line:color-mix(in srgb,var(--u-primary) 12%,#fff);
  --u-dark:color-mix(in srgb,var(--u-primary) 30%,#050a16);
  --u-text:#1c2333;--u-muted:#5d687c;
  font-family:"DM Sans",sans-serif;color:var(--u-text);background:#fff;padding-bottom:5.5rem;
}
.uni a{color:inherit}

/* Hero photo plein cadre */
.u-hero{position:relative;aspect-ratio:1/.97;background:var(--u-primary);overflow:hidden}
.u-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.u-noph{display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:4.5rem;font-weight:700;color:var(--u-on-primary);opacity:.85}
.u-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(5,10,22,.55) 68%,rgba(5,10,22,.92) 100%)}
.u-hero-txt{position:absolute;left:1.25rem;right:1.25rem;bottom:1.35rem;color:#fff}
.u-badge{display:inline-block;padding:.32rem .8rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--u-accent) 70%,transparent);
  background:rgba(10,18,36,.35);backdrop-filter:blur(4px);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.6rem}
.u-name{font-family:"Playfair Display",serif;font-size:1.95rem;font-weight:700;text-transform:uppercase;line-height:1.1;letter-spacing:.01em;color:#fff}
.u-line{margin-top:.45rem;font-size:.82rem;font-weight:500}
.u-st{color:var(--u-accent)}
.u-un{text-transform:uppercase;opacity:.92}
.u-un::before{content:"·";margin:0 .45rem;opacity:.7}

/* Carte université */
.u-uni{position:relative;overflow:hidden;margin:.9rem 1.25rem 0;padding:.9rem;border-radius:14px;background:var(--u-tint);
  border:1px solid var(--u-line);display:flex;gap:.85rem;align-items:center}
.u-campus{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.12}
.u-logo,.u-uni-txt{position:relative}
.u-logo{min-width:46px;max-width:140px;height:46px;border-radius:10px;background:var(--u-surface);flex-shrink:0;overflow:hidden;border:1px solid var(--u-line);
  display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-weight:700;color:var(--u-primary)}
.u-logo img{display:block;height:100%;width:auto;max-width:140px;object-fit:contain;padding:5px}
.u-inst-name{font-size:.88rem;font-weight:600;line-height:1.3}
.u-uni-sub{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .7rem;margin-top:.4rem}
.u-chip{display:inline-block;padding:.22rem .55rem;border-radius:4px;background:color-mix(in srgb,var(--u-primary) 12%,#fff);
  color:var(--u-primary);font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.u-loc{display:inline-flex;align-items:center;gap:5px;color:var(--u-muted);font-size:.76rem}
.u-loc svg{width:13px;height:13px}
.u-slogan{font-family:"Playfair Display",serif;font-style:italic;font-size:.75rem;color:var(--u-muted);margin-top:.4rem;line-height:1.35}

.u-sec{padding:1.6rem 1.4rem 0}
.u-h{font-size:.95rem;font-weight:600;color:var(--u-primary);padding-bottom:.55rem;margin-bottom:.9rem;border-bottom:1px solid var(--u-line)}
.u-about{font-size:.88rem;line-height:1.75;color:var(--u-text);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.u-about.open{display:block}

.u-tl{list-style:none;margin:0 0 0 5px;padding:0}
.u-tl li{position:relative;padding:0 0 1.05rem 1.15rem;border-left:2px solid var(--u-line)}
.u-tl li:last-child{padding-bottom:0;border-left-color:transparent}
.u-tl li::before{content:"";position:absolute;left:-6px;top:.3rem;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--u-primary)}
.u-tl li:last-child::before{left:-5px}
.u-t{font-size:.9rem;font-weight:600;line-height:1.35}
.u-s{font-size:.82rem;color:var(--u-muted);margin-top:1px}
.u-p{font-size:.76rem;color:var(--u-primary);opacity:.8;margin-top:2px}

.u-tags{display:flex;flex-wrap:wrap;gap:.45rem}
.u-tag{padding:.38rem .85rem;border-radius:999px;background:var(--u-tint);color:var(--u-primary);font-size:.78rem;font-weight:500}

.u-cta,.u-btn{display:flex;align-items:center;justify-content:center;gap:.55rem;border-radius:10px;font-family:inherit;
  font-weight:600;font-size:.86rem;text-decoration:none;cursor:pointer;line-height:1.2}
.u-cta{width:100%;padding:.95rem;background:var(--u-primary);color:var(--u-on-primary);border:1.5px solid var(--u-primary)}
.u-btn{padding:.8rem .5rem;background:#fff;color:var(--u-primary);border:1.5px solid var(--u-line);transition:border-color .15s}
.u-btn:hover{border-color:var(--u-primary)}
.u-cta:focus-visible,.u-btn:focus-visible,.u-bar:focus-visible{outline:3px solid var(--u-accent);outline-offset:2px}
.u-cta svg,.u-btn svg{width:18px;height:18px;flex-shrink:0}
.u-in{font-weight:700;font-size:.95rem;letter-spacing:-.02em}
.u-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
.u-grid:first-child{margin-top:0}
.u-grid .u-btn:last-child:nth-child(odd){grid-column:1/-1}
/* Boutons Kairos / WhatsApp */
.u-btn.u-wa svg{color:#25a244}
.u-btn.u-kairos{border-color:color-mix(in srgb,var(--u-primary) 35%,#fff)}

.u-foot{margin:2rem 1.4rem 0;padding-top:1rem;border-top:1px solid var(--u-line);text-align:center;font-size:.72rem;color:var(--u-muted)}
.u-foot a{text-decoration:none}
.u-foot a.u-stats{display:block;margin-top:.4rem;opacity:.6}

/* Barre fixe « Enregistrer le contact » */
.u-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;z-index:50;display:flex;align-items:center;gap:.8rem;
  padding:.75rem 1rem;background:var(--u-dark);color:#fff;border:0;cursor:pointer;text-align:left;font-family:inherit}
.u-bar-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--u-primary);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.u-bar-av img{width:100%;height:100%;object-fit:cover}
.u-bar-t{flex:1;line-height:1.25}
.u-bar-t small{display:block;font-size:.66rem;opacity:.65}
.u-bar-t b{font-size:.92rem;font-weight:600}
.u-bar-go{width:38px;height:34px;border-radius:8px;background:var(--u-primary);color:var(--u-on-primary);display:flex;align-items:center;justify-content:center}
.u-bar-go svg{width:18px;height:18px}
.uni.wrap{width:100%}

</style>
</head>
<body>
 
<div id="app" class="card">
  <div class="loading"><div class="spin"></div><p>Chargement...</p></div>
</div>
 
<!-- LIGHTBOX produit (bottom sheet) -->
<div class="lb-ov" id="lbOv" onclick="if(event.target===this)closeLb()">
  <div style="position:relative;width:100%;max-width:420px">
    <button class="lb-close" onclick="closeLb()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>

function hexToRgb(hex){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function lighten(hex,amt){
  const {r,g,b}=hexToRgb(hex);
  const l=v=>Math.min(255,Math.round(v+(255-v)*amt));
  return '#'+[l(r),l(g),l(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// Applique la couleur du thème choisi (dans le dashboard) à toute la carte
function applyTheme(themeId){
  const t=THEMES[themeId]||THEMES.noir;
  const root=document.documentElement.style;
  const {r,g,b}=hexToRgb(t.gold);
  root.setProperty('--gold',t.gold);
  root.setProperty('--gold2',lighten(t.gold,0.35));
  root.setProperty('--gold-bg',`rgba(${r},${g},${b},0.1)`);
  root.setProperty('--gold-15',`rgba(${r},${g},${b},0.15)`);
  root.setProperty('--gold-20',`rgba(${r},${g},${b},0.2)`);
  root.setProperty('--gold-25',`rgba(${r},${g},${b},0.25)`);
  root.setProperty('--gold-40',`rgba(${r},${g},${b},0.4)`);
  root.setProperty('--gold-45',`rgba(${r},${g},${b},0.45)`);
  root.setProperty('--ink',t.ink);
  root.setProperty('--ink2',lighten(t.ink,0.25));
}

  if(c.website)l.push({href:c.website,ico:UI_ICONS.globe,lbl:'Site web',val:c.website.replace(/https?:\/\//,''),t:1});

function buildCatalogue(c){
  let items=[];
  try{
    if(Array.isArray(c.catalogue)) items=c.catalogue;
    else if(typeof c.catalogue==='string'&&c.catalogue) items=JSON.parse(c.catalogue);
  }catch(e){}
  if(!items||!items.length) return '';
  window.catalogueItems=items;
  window.catalogueMeta={waBase:(c.whatsapp||c.phone||'').replace(/\D/g,''),company:c.company||''};
 
  const cards=items.map((item,idx)=>{
    const name=item.title||item.name||'';
    const desc=item.desc||item.description||'';
    const price=item.price;
    const img=item.image_url;
    const imgHTML=img
      ?`<img src="${img}" alt="${name}" onerror="imgFallback(this,'bag','cat-img-placeholder')">`
      :`<div class="cat-img-placeholder">${UI_ICONS.bag}</div>`;
    const priceHTML=price?`<div class="cat-price">${Number(price).toLocaleString('fr-FR')} FCFA</div>`:'';
    const descHTML=desc?`<div class="cat-desc">${desc}</div>`:'';
    return `<div class="cat-card" onclick="openLb(${idx})">
      <div class="cat-img-wrap">${imgHTML}</div>
      <div class="cat-body">
        <div class="cat-name">${name}</div>
        ${descHTML}
        ${priceHTML}
      </div>
    </div>`;
  }).join('');
 
  return `<div class="sec">
    <div class="sec-header">
      <div class="sec-ico">${UI_ICONS.bag}</div>
      <span class="sec-lbl">Catalogue produits</span>
    </div>
    <div class="cat-scroll">${cards}</div>
  </div>
  <div class="divider"><span></span></div>`;
}
 
let lbIndex=0;
function renderLb(){
  const items=window.catalogueItems||[];
  const meta=window.catalogueMeta||{};
  const item=items[lbIndex];
  if(!item) return;
  const img=item.image_url;
  const imgHTML=img
    ?`<img class="lb-img" src="${img}" alt="${item.title||''}" onerror="imgFallback(this,'bag','lb-img-placeholder')">`
    :`<div class="lb-img-placeholder">${UI_ICONS.bag}</div>`;
  document.getElementById('lbImgWrap').innerHTML=imgHTML;
  document.getElementById('lbName').textContent=item.title||item.name||'';
  document.getElementById('lbDesc').textContent=item.desc||item.description||'';
  const price=item.price;
  document.getElementById('lbPrice').textContent=price?Number(price).toLocaleString('fr-FR')+' FCFA':'';
  const name=item.title||item.name||'cet article';
  const orderMsg=encodeURIComponent(`Bonjour${meta.company?' '+meta.company:''}, je suis intéressé(e) par : ${name}`);
  document.getElementById('lbOrderBtnWrap').innerHTML=meta.waBase
    ?`<a href="https://wa.me/${meta.waBase}?text=${orderMsg}" target="_blank" class="lb-order-btn">Commander sur WhatsApp</a>`
    :'';
  document.getElementById('lbCounter').textContent=items.length>1?`${lbIndex+1} / ${items.length}`:'';
  const single=items.length<=1;
  document.getElementById('lbPrev').classList.toggle('disabled',single);
  document.getElementById('lbNext').classList.toggle('disabled',single);
}
function openLb(idx){
  lbIndex=idx;
  renderLb();
  document.getElementById('lbOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function navLb(dir){
  const items=window.catalogueItems||[];
  if(items.length<2) return;
  lbIndex=(lbIndex+dir+items.length)%items.length;
  renderLb();
}
function closeLb(){
  document.getElementById('lbOv').classList.remove('open');
  document.body.style.overflow='';
}
(function(){
  let touchStartX=0;
  document.addEventListener('DOMContentLoaded',()=>{
    const ov=document.getElementById('lbOv');
    if(!ov) return;
    ov.addEventListener('touchstart',(e)=>{ touchStartX=e.touches[0].clientX; },{passive:true});
    ov.addEventListener('touchend',(e)=>{
      const dx=e.changedTouches[0].clientX-touchStartX;
      if(Math.abs(dx)>50) navLb(dx>0?-1:1);
    },{passive:true});
  });
  document.addEventListener('keydown',(e)=>{
    const ov=document.getElementById('lbOv');
    if(!ov||!ov.classList.contains('open')) return;
    if(e.key==='Escape') closeLb();
    if(e.key==='ArrowLeft') navLb(-1);
    if(e.key==='ArrowRight') navLb(1);
  });
})();

// Déplie / replie le panneau d'infos entreprise (à propos, horaires, localisation) au clic sur la flèche
function toggleCompanyDetails(){
  const details=document.getElementById('coDetails');
  const arr=document.getElementById('coArr');
  if(!details) return;
  const isOpen=details.classList.contains('open');
  if(isOpen){
    details.style.maxHeight='0px';
    details.classList.remove('open');
  }else{
    details.style.maxHeight=details.scrollHeight+'px';
    details.classList.add('open');
  }
  if(arr) arr.classList.toggle('open',!isOpen);
}
 
function saveVCard(c){
  const lines=['BEGIN:VCARD','VERSION:3.0',
    'FN:'+(c.firstname||'')+' '+(c.lastname||''),
    'N:'+(c.lastname||'')+';'+(c.firstname||'')+';;;'];
  if(c.jobtitle)lines.push('TITLE:'+c.jobtitle);
  if(c.company)lines.push('ORG:'+c.company);
  if(c.phone)lines.push('TEL;TYPE=CELL:'+c.phone);
  if(c.email)lines.push('EMAIL:'+c.email);
  if(c.website)lines.push('URL:'+c.website);
  if(c.location&&!c.location.startsWith('http'))lines.push('ADR:;;'+c.location+';;;;');
  lines.push('END:VCARD');
  const blob=new Blob([lines.join('\n')],{type:'text/vcard'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=(c.firstname||'contact')+'_'+(c.lastname||'')+'.vcf';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Contact enregistré !');
}
 
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
 
// ═══ PROFIL UNIVERSITAIRE (cartes rattachées à une université) ═══
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function shareProfile(name){
  const url=location.href.replace(/([?&])src=[^&]*&?/,'$1').replace(/[?&]$/,'');
  if(navigator.share){navigator.share({title:name,url}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>showToast('✓ Lien copié !')).catch(()=>{});}
}
const UNI_SVG={
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/>',
  user:'<circle cx="10" cy="8" r="4"/><path d="M3 20a7 7 0 0 1 14 0M19 8v6M16 11h6"/>',
  /* NOUVEAU : toque (portail Kairos) et bulle (WhatsApp) */
  cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5M22 9v5"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/>'
};
function uniIco(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+UNI_SVG[n]+'</svg>';}
function uniHex(v,fb){return /^#[0-9a-fA-F]{6}$/.test(v||'')?v:fb;}
function uniIsLight(h){const c=h.slice(1);const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return(0.299*r+0.587*g+0.114*b)>170;}
function uniUrl(u){if(!u)return '';u=String(u).trim();return /^(https?:|mailto:|tel:)/i.test(u)?u:'https://'+u.replace(/^\/+/,'');}
/* NOUVEAU : lien WhatsApp — accepte un numéro (+221…) OU un lien d'invitation de groupe */
function uniWa(v){v=String(v||'').trim();if(!v)return '';return /[a-z]/i.test(v)?uniUrl(v):'https://wa.me/'+v.replace(/\D/g,'');}
function uniList(v){
  if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){return [];}}
  return Array.isArray(v)?v:[];
}

/* Critère unique de bascule : le client a une université ET elle a été chargée. */
function isPartnerUniversityProfile(c,uni){return !!(c&&c.university_id&&uni&&uni.id===c.university_id);}

function uniTimeline(items){
  return '<ul class="u-tl">'+items.map(i=>
    '<li><div class="u-t">'+esc(i.title)+'</div>'+
    (i.place?'<div class="u-s">'+esc(i.place)+'</div>':'')+
    (i.period?'<div class="u-p">'+esc(i.period)+'</div>':'')+'</li>').join('')+'</ul>';
}
function uniSection(title,inner){return inner?'<section class="u-sec"><h2 class="u-h">'+title+'</h2>'+inner+'</section>':'';}

function renderUniversityProfile(c,uni){
  const fullName=((c.firstname||'')+' '+(c.lastname||'')).trim();
  window.__client=c;window.__uni=uni;
  document.title=fullName+' — '+(uni.name||'Print Legacy');

  const primary=uniHex(uni.primary_color,'#1f3a8a');
  const surface=uniHex(uni.secondary_color,'#ffffff');
  const accent=uniHex(uni.accent_color,null);
  const vars='--u-primary:'+primary+';--u-surface:'+surface+';--u-on-primary:'+(uniIsLight(primary)?'#10141f':'#ffffff')+';'+
    (accent?'--u-accent:'+accent+';':'--u-accent:color-mix(in srgb,'+primary+' 35%,#fff);');
  const ini=esc((((c.firstname||'')[0]||'')+((c.lastname||'')[0]||'')).toUpperCase());

  /* 1. Hero photo plein cadre */
  const st=c.formation||c.jobtitle||'Étudiant·e';
  const hero='<header class="u-hero">'+
    (c.photo?'<img class="u-photo" src="'+esc(c.photo)+'" alt="'+esc(fullName)+'">':'<div class="u-photo u-noph">'+ini+'</div>')+
    '<div class="u-shade"></div><div class="u-hero-txt"><span class="u-badge">Carte étudiante</span>'+
    '<h1 class="u-name">'+esc(fullName)+'</h1>'+
    '<div class="u-line"><span class="u-st">'+esc(st)+'</span><span class="u-un">'+esc(uni.name||'')+'</span></div></div></header>';

  /* 2. Carte université */
  const logo=uni.logo_url?'<img src="'+esc(uni.logo_url)+'" alt="'+esc(uni.name||'')+'">':esc((uni.name||'?').slice(0,2).toUpperCase());
  const campus=uni.campus_image_url?'<img class="u-campus" src="'+esc(uni.campus_image_url)+'" alt="">':'';
  const loc=c.location&&!/^https?:/i.test(c.location)?'<span class="u-loc">'+uniIco('pin')+esc(c.location)+'</span>':'';
  const uniCard='<section class="u-uni">'+campus+'<div class="u-logo">'+logo+'</div><div class="u-uni-txt">'+
    '<div class="u-inst-name">'+esc(uni.name||'')+'</div>'+
    '<div class="u-uni-sub"><span class="u-chip">Université partenaire</span>'+loc+'</div>'+
    (uni.slogan?'<div class="u-slogan">'+esc(uni.slogan)+'</div>':'')+'</div></section>';

  /* 3. À propos */
  const about=c.bio?uniSection('À propos','<p class="u-about" onclick="this.classList.toggle(\'open\')">'+esc(c.bio)+'</p>'):'';

  /* 4. Liens (placés en fin de profil, avant le pied de page) */
  const extras=[];
  const pf=c.portfolio_url||c.portfolio;
  if(pf)extras.push({href:uniUrl(pf),label:'Portfolio'});
  if(c.website)extras.push({href:uniUrl(c.website),label:'Site web'});
  uniList(c.custom_links).forEach(l=>{if(l&&l.url)extras.push({href:uniUrl(l.url),label:l.label||'Lien'});});
  const a=(href,inner,cls)=>'<a class="'+cls+'" href="'+esc(href)+'" target="_blank" rel="noopener">'+inner+'</a>';
  const btns=[];
  if(c.linkedin)btns.push(a(uniUrl(c.linkedin),'<span class="u-in">in</span>LinkedIn','u-btn'));
  if(c.email)btns.push('<a class="u-btn" href="mailto:'+esc(c.email)+'">'+uniIco('mail')+'Email</a>');

  /* NOUVEAU — WhatsApp direct (numéro de l'étudiant) */
  if(c.whatsapp)btns.push(a(uniWa(c.whatsapp),uniIco('chat')+'WhatsApp','u-btn u-wa'));

  /* NOUVEAU — Portail Kairos : le lien est propre à l'université (uni.kairos_url),
     avec possibilité de le surcharger pour un étudiant (c.kairos_url). */
  const kairos=c.kairos_url||uni.kairos_url;
  if(kairos)btns.push(a(uniUrl(kairos),uniIco('cap')+'Portail Kairos','u-btn u-kairos'));

  extras.slice(0,3).forEach(e=>btns.push(a(e.href,uniIco('link')+esc(e.label),'u-btn')));
  btns.push('<button class="u-btn" type="button" onclick="uniShare()">'+uniIco('share')+'Partager</button>');
  const cv=c.cv_url?a(uniUrl(c.cv_url),uniIco('file')+'Consulter le CV','u-cta'):'';
  const links=uniSection('Liens',cv+'<div class="u-grid">'+btns.join('')+'</div>');

  /* 5. Expériences + compétences (le parcours académique n'est plus affiché) */
  const exp=uniList(c.experiences).map(i=>i&&({title:i.title||i.poste,place:i.place||i.org,period:i.period||i.periode})).filter(i=>i&&i.title).slice(0,3);
  let skills=c.skills;if(typeof skills==='string')skills=skills.split(',');
  skills=(Array.isArray(skills)?skills:[]).map(s=>String(s).trim()).filter(Boolean).slice(0,6);
  const exps=exp.length?uniSection('Expériences',uniTimeline(exp)):'';
  const tags=skills.length?uniSection('Compétences','<div class="u-tags">'+skills.map(s=>'<span class="u-tag">'+esc(s)+'</span>').join('')+'</div>'):'';

  const foot='<footer class="u-foot"><a href="https://printlegacy.github.io">Carte NFC par Print Legacy</a>'+
    '<a class="u-stats" href="https://printlegacy-platform.vercel.app/stats.html?slug='+encodeURIComponent(c.slug||'')+'">Statistiques de la carte</a></footer>';

  /* Barre fixe */
  const bar='<button class="u-bar" type="button" onclick="uniSave()"><span class="u-bar-av">'+(c.photo?'<img src="'+esc(c.photo)+'" alt="">':ini)+'</span>'+
    '<span class="u-bar-t"><small>Ajouter à mes contacts</small><b>Enregistrer le contact</b></span>'+
    '<span class="u-bar-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>';

  document.getElementById('app').style.maxWidth='390px';
  document.getElementById('app').innerHTML='<div class="wrap uni" style="'+vars+'">'+hero+uniCard+about+exps+tags+links+foot+bar+'</div>';
}
function uniShare(){const c=window.__client||{};shareProfile(((c.firstname||'')+' '+(c.lastname||'')).trim());}
function uniSave(){const c=window.__client||{};saveVCard(Object.assign({},c,{jobtitle:c.jobtitle||c.formation||'',company:c.company||(window.__uni&&window.__uni.name)||''}));}

function render(c){
  applyTheme(c.theme||'noir');
  const name=(c.firstname||'')+' '+(c.lastname||'');
  document.title=name+' — Print Legacy';
  const contacts=buildContacts(c);
  const socials=buildSocials(c);
  const catalogueHTML=buildCatalogue(c);
  const av=c.photo?`<img src="${c.photo}" alt="${name}">`:`${ini(c.firstname,c.lastname)}`;
  const heroImg=c.cover_url||c.cover_photo||c.photo;
  const heroHTML=heroImg
    ?`<img class="hero-img" src="${heroImg}" alt="${name}">`
    :`<div class="hero-placeholder"><div class="hero-initials-big">${ini(c.firstname,c.lastname)}</div></div>`;
  const roleHTML=c.jobtitle?`<em>${c.jobtitle}</em>${c.company?' · '+c.company:''}`:(c.company||'');
  const coLogoHTML=c.company_logo_url
    ?`<img src="${c.company_logo_url}" alt="${c.company}" onerror="imgFallback(this,'building','co-logo-fallback')">`
    :UI_ICONS.building;
  const hasCoDetails=!!(c.company_about||c.company_hours||c.location);
  const coDetailsHTML=hasCoDetails
    ?`<div class="co-details" id="coDetails">${c.company_about?`<div class="co-detail-about">${c.company_about}</div>`:''}${c.company_hours?`<div class="co-detail-row"><span class="co-detail-ico">${UI_ICONS.clock}</span><span>${c.company_hours}</span></div>`:''}${c.location?`<a href="${c.location.startsWith('http')?c.location:'https://maps.google.com/?q='+encodeURIComponent(c.location)}" target="_blank" class="co-detail-row"><span class="co-detail-ico">${UI_ICONS.mapPin}</span><span>${c.location.startsWith('http')?'Voir sur la carte':c.location}</span></a>`:''}</div>`
    :'';
  const compHTML=c.company
    ?`<div class="company-card-wrap">
        <div class="company-card" ${hasCoDetails?'onclick="toggleCompanyDetails()"':''} style="${hasCoDetails?'cursor:pointer':''}">
          <div class="co-left">
            <div class="co-logo">${coLogoHTML}</div>
            <div><div class="co-name">${c.company}</div><span class="co-badge">Entreprise principale</span></div>
          </div>
          ${hasCoDetails?`<div class="co-arr" id="coArr">${UI_ICONS.chevron}</div>`:''}
        </div>
        ${coDetailsHTML}
      </div>`
    :'';
  const aboutHTML=c.bio
    ?`<div class="sec"><div class="sec-header"><div class="sec-ico">${UI_ICONS.user}</div><span class="sec-lbl">À propos</span></div><p class="about-txt">${c.bio}</p></div><div class="divider"><span></span></div>`
    :'';
  // cv_url = le PDF/CV uploadé par le client lors de sa commande (order.html)
  // On l'affiche seulement si le champ existe en base, sinon la section est vide
  const cvHTML=c.cv_url
    ?`<div class="sec"><div class="sec-header"><div class="sec-ico">${UI_ICONS.idcard}</div><span class="sec-lbl">CV / Portfolio</span></div><a href="${c.cv_url}" target="_blank" class="clink"><div class="clink-ico">📄</div><div class="clink-body"><span class="clink-lbl">Document</span><span class="clink-val">Voir le CV / Portfolio</span></div><span class="clink-arr">›</span></a></div><div class="divider"><span></span></div>`
    :'';
  const contactHTML=contacts.length
    ?`<div class="sec"><div class="sec-header"><div class="sec-ico">${UI_ICONS.idcard}</div><span class="sec-lbl">Contact</span></div><div class="contact-list">${contacts.map(l=>`<a href="${l.href}" class="clink" ${l.t?'target="_blank"':''}><div class="clink-ico" style="${l.color?'color:'+l.color:''}">${l.ico}</div><div class="clink-body"><span class="clink-lbl">${l.lbl}</span><span class="clink-val">${l.val}</span></div><span class="clink-arr">›</span></a>`).join('')}</div></div><div class="divider"><span></span></div>`
    :'';
  const socialHTML=socials.length
    ?`<div class="sec"><div class="sec-header"><div class="sec-ico">${UI_ICONS.share}</div><span class="sec-lbl">Réseaux sociaux</span></div><div class="soc-grid">${socials.map(s=>`<a href="${s.href}" target="_blank" class="soc-btn"><span class="soc-ico" style="background:${s.bg}">${s.ico}</span><span class="soc-name">${s.name}</span></a>`).join('')}</div></div><div class="divider"><span></span></div>`
    :'';
 
  document.getElementById('app').innerHTML=`
    <div class="card">
      <div class="hero">${heroHTML}<div class="hero-overlay"></div>
        <div class="hero-content">
          <div class="hero-badge">Carte professionnelle</div>
          <div class="hero-name">${name}</div>
          <div class="hero-role">${roleHTML}</div>
        </div>
      </div>
      ${compHTML}<div class="spacer"></div>
      ${aboutHTML}${cvHTML}${contactHTML}${catalogueHTML}${socialHTML}
      <div style="text-align:center;padding:1rem 1.2rem 1.5rem">
        <a href="https://printlegacy.github.io" style="font-size:.68rem;color:var(--muted);text-decoration:none">Propulsé par <strong style="color:var(--ink)">Print Legacy</strong></a>
      </div>
    </div>
    <div class="save-bar">
      <div class="sb-left">
        <div class="sb-av">${av}</div>
        <div class="sb-txt"><span class="sb-sublbl">Ajouter à mes contacts</span><span class="sb-title">Enregistrer le contact</span></div>
      </div>
      <button class="sb-btn" onclick='saveVCard(${JSON.stringify(c).replace(/'/g,"&#39;")})'>→</button>
    </div>`;
}
 
async function init(){
  const slug=getSlug();
  if(!slug){
    document.getElementById('app').innerHTML=`<div class="err"><div style="width:44px;height:44px;color:var(--gold)">${UI_ICONS.sparkle}</div><h2>Print Legacy</h2><p>Plateforme de cartes digitales NFC.</p><a href="https://printlegacy.github.io">← Voir le site</a></div>`;
    return;
  }
  const {data,error}=await sb.from('clients').select('*').eq('slug',slug).eq('status','active').single();
  if(error||!data){
    document.getElementById('app').innerHTML=`<div class="err"><div style="width:44px;height:44px;color:var(--muted)">${UI_ICONS.frown}</div><h2>Carte introuvable</h2><p>Le profil "<strong>${slug}</strong>" n'est pas encore activé.</p><a href="https://printlegacy.github.io">← Accueil</a></div>`;
    return;
  }
  // Carte rattachée à une université : on charge l'université (logo, couleurs, liens) puis profil universitaire.
  // Sinon (ou si la lecture échoue) : profil classique, inchangé.
  let uni=null;
  if(data.university_id){
    try{const r=await sb.from('universities').select('*').eq('id',data.university_id).single();uni=r.data||null;}catch(e){}
  }
  if(isPartnerUniversityProfile(data,uni)) renderUniversityProfile(data,uni); else render(data);
  trackView(data.id); // on enregistre la vue une fois la carte affichée avec succès
}
 
init();
